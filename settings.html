<div id="narrative_agent_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Narrative Agent（精简版 · 单次调用）</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label">
                <input type="checkbox" id="na_enabled" name="na_enabled">
                <span>启用叙事引擎</span>
            </label>
            <small>启用后每次发送只调用一次 API：插件用自己的指令替换 prompt，返回内容剥离思考块与状态块后，只把<b>正文</b>写进消息。</small>

            <hr>

            <h4>历史窗口</h4>
            <div class="flex-container">
                <label>最小轮数 (n):</label>
                <input type="number" id="na_history_window" min="1" max="50" step="1" style="width: 80px;">
                <label style="margin-left: 8px;">生长缓冲 (m):</label>
                <input type="number" id="na_history_growth" min="0" max="50" step="1" style="width: 80px;">
            </div>
            <small>窗口在 n ~ n+m 轮之间生长：涨到 n+m 后一次裁掉最早的 m+1 轮回到 n，让历史前缀保持稳定以提高缓存命中。</small>

            <hr>

            <h4>正文字数</h4>
            <div class="flex-container">
                <label>最小字数:</label>
                <input type="number" id="na_min_reply_chars" min="0" max="9999" step="50" style="width: 100px;">
                <label style="margin-left: 8px;">最大字数:</label>
                <input type="number" id="na_max_reply_chars" min="0" max="9999" step="50" style="width: 100px;">
            </div>
            <small>只约束正文（状态块不计入）。0 表示不设该端限制。</small>

            <hr>

            <h4>世界书</h4>
            <div class="flex-container">
                <label>来源:</label>
                <select id="na_worldbook_source" style="width: 220px;">
                    <option value="auto">自动（优先卡包内嵌，回退世界书库）</option>
                    <option value="card">卡包内嵌（character_book）</option>
                    <option value="world">世界书库（按名称加载）</option>
                </select>
            </div>
            <label class="checkbox_label">
                <input type="checkbox" id="na_inject_constant" name="na_inject_constant">
                <span>注入常驻条目</span>
            </label>
            <label class="checkbox_label">
                <input type="checkbox" id="na_inject_keyword" name="na_inject_keyword">
                <span>注入关键词命中条目</span>
            </label>
            <small>格式化条目（[TOOL:*] / [UI] / [initvar] / [mvu_update]）一律不注入。条目在初始化与每轮结束后预取，供下一轮同步拼 prompt 使用。</small>

            <hr>

            <h4>输出处理</h4>
            <label class="checkbox_label">
                <input type="checkbox" id="na_strip_thinking" name="na_strip_thinking">
                <span>剥离思考块（thinking / analysis / reasoning 等）</span>
            </label>
            <label class="checkbox_label">
                <input type="checkbox" id="na_dialogue_driven" name="na_dialogue_driven">
                <span>对话驱动推进剧情</span>
            </label>

            <hr>

            <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px;">
                <input type="button" class="menu_button" id="na_reset_state" value="重置状态">
                <input type="button" class="menu_button" id="na_refresh_state" value="刷新显示">
                <input type="button" class="menu_button" id="na_reload_worldbook" value="刷新世界书缓存">
            </div>

            <h4 style="margin-top: 10px;">当前状态</h4>
            <div id="na_state_display" style="max-height: 220px; overflow: auto; white-space: pre-wrap; font-size: 12px; opacity: 0.85;"></div>
        </div>
    </div>
</div>
